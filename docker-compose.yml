x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${POSTGRES_DB:-library}
  DB_USER: ${POSTGRES_USER:-library}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-library}
  DB_HOST: db
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  FINE_MULTIPLIER: ${FINE_MULTIPLIER:-2}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: *app-environment
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command:
      ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/home/app/celerybeat-schedule",
      ]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
